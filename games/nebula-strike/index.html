<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEBULA STRIKE - 3D 星云突击</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #fff;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }

  /* ===== HUD ===== */
  #hud {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 10;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 18px 22px;
  }
  .hud-row { display: flex; justify-content: space-between; align-items: flex-start; }

  .panel {
    background: rgba(0, 20, 40, 0.55);
    border: 1px solid rgba(0, 200, 255, 0.35);
    border-radius: 10px;
    padding: 10px 16px;
    backdrop-filter: blur(8px);
    box-shadow: 0 0 24px rgba(0, 180, 255, 0.15);
  }

  .stat { font-size: 13px; letter-spacing: 1px; color: #7dd3fc; text-transform: uppercase; }
  .stat b {
    display: block;
    font-size: 26px;
    color: #fff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 12px #0ff;
    letter-spacing: 1px;
  }
  .stat b.warn { color: #ff4466; text-shadow: 0 0 12px #f36; }

  #livesBar { display: flex; gap: 6px; margin-top: 6px; }
  .heart {
    width: 14px; height: 14px;
    background: #ff3366;
    clip-path: polygon(50% 100%, 0 40%, 0 15%, 25% 0, 50% 20%, 75% 0, 100% 15%, 100% 40%);
    box-shadow: 0 0 10px #ff3366;
    transition: opacity .3s, transform .3s;
  }
  .heart.dead { opacity: .18; transform: scale(.7); }

  /* 武器 / 护盾 */
  #weaponBar {
    margin-top: 8px;
    width: 160px;
    height: 6px;
    background: rgba(255,255,255,.12);
    border-radius: 3px;
    overflow: hidden;
  }
  #weaponFill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #0ff, #08f);
    box-shadow: 0 0 12px #0ff;
    transition: width .1s linear;
  }
  #shieldBar {
    margin-top: 6px;
    width: 160px;
    height: 6px;
    background: rgba(255,255,255,.12);
    border-radius: 3px;
    overflow: hidden;
  }
  #shieldFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff0, #fa0);
    box-shadow: 0 0 12px #ff0;
    transition: width .15s linear;
  }

  /* 连击 */
  #combo {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 58px;
    font-weight: 900;
    color: #ffdd00;
    text-shadow: 0 0 30px #ff8800, 0 0 60px #ff4400;
    pointer-events: none;
    opacity: 0;
    z-index: 15;
    letter-spacing: 2px;
    transition: transform .18s cubic-bezier(.2,1.6,.4,1), opacity .3s;
  }
  #combo.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }

  /* 伤害红屏 */
  #damageFlash {
    position: fixed; inset: 0;
    background: radial-gradient(circle, transparent 40%, rgba(255,0,40,.75));
    opacity: 0;
    pointer-events: none;
    z-index: 12;
    transition: opacity .25s;
  }
  #damageFlash.on { opacity: 1; transition: opacity .05s; }

  /* Boss 血条 */
  #bossBar {
    position: fixed;
    top: 90px; left: 50%;
    transform: translateX(-50%);
    width: min(520px, 80vw);
    display: none;
    z-index: 11;
  }
  #bossBar.show { display: block; }
  #bossName {
    text-align: center;
    font-size: 13px;
    letter-spacing: 3px;
    color: #ff6688;
    text-shadow: 0 0 12px #f36;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  #bossTrack {
    height: 14px;
    background: rgba(60,0,20,.7);
    border: 1px solid rgba(255,80,120,.6);
    border-radius: 7px;
    overflow: hidden;
    box-shadow: 0 0 20px rgba(255,60,100,.4);
  }
  #bossFill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #ff2255, #ff8800);
    box-shadow: 0 0 20px #f36;
    transition: width .2s linear;
  }

  /* 波次提示 */
  #waveMsg {
    position: fixed;
    top: 42%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(26px, 6vw, 52px);
    font-weight: 900;
    color: #0ff;
    text-shadow: 0 0 30px #0ff, 0 0 60px #08f;
    letter-spacing: 6px;
    opacity: 0;
    pointer-events: none;
    z-index: 14;
    transition: opacity .4s, transform .4s;
  }
  #waveMsg.show { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }

  /* ===== 覆盖层菜单 ===== */
  #overlay {
    position: fixed; inset: 0;
    background: radial-gradient(circle at 50% 40%, rgba(0,30,60,.92), rgba(0,0,5,.98));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    z-index: 20;
    text-align: center;
    padding: 24px;
  }
  #overlay.hide { display: none; }

  #title {
    font-size: clamp(38px, 9vw, 76px);
    font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(180deg, #fff, #0ff 40%, #08f 80%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 30px rgba(0,200,255,.6));
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { filter: drop-shadow(0 0 25px rgba(0,200,255,.5)); }
    50% { filter: drop-shadow(0 0 55px rgba(0,220,255,.95)); }
  }

  #subtitle {
    color: #7dd3fc;
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: -8px;
  }

  .controls {
    color: #94a3b8;
    font-size: 14px;
    line-height: 2;
    max-width: 440px;
    background: rgba(0,30,60,.4);
    border: 1px solid rgba(0,180,255,.2);
    border-radius: 12px;
    padding: 16px 26px;
    margin-top: 6px;
  }
  .controls kbd {
    display: inline-block;
    background: rgba(0,180,255,.15);
    border: 1px solid rgba(0,180,255,.4);
    border-radius: 5px;
    padding: 1px 8px;
    font-family: inherit;
    font-size: 13px;
    color: #0ff;
    margin: 0 2px;
  }

  #finalStats {
    display: none;
    gap: 28px;
    margin: 6px 0;
  }
  #finalStats.show { display: flex; }
  #finalStats div { text-align: center; }
  #finalStats span {
    display: block;
    font-size: 12px;
    color: #7dd3fc;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  #finalStats b {
    font-size: 32px;
    color: #fff;
    text-shadow: 0 0 16px #0ff;
  }

  #startBtn {
    margin-top: 10px;
    padding: 16px 54px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 3px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #0ff, #08f);
    color: #001018;
    cursor: pointer;
    box-shadow: 0 0 40px rgba(0,220,255,.6), inset 0 0 20px rgba(255,255,255,.4);
    transition: transform .15s, box-shadow .15s;
    text-transform: uppercase;
  }
  #startBtn:hover { transform: scale(1.07); box-shadow: 0 0 60px rgba(0,220,255,.95); }
  #startBtn:active { transform: scale(.97); }

  #hint {
    color: #475569;
    font-size: 12px;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  /* 移动端虚拟按键 */
  #mobileCtrl {
    position: fixed;
    bottom: 18px; left: 0; right: 0;
    display: none;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 11;
    pointer-events: none;
  }
  #mobileCtrl button {
    pointer-events: auto;
    width: 74px; height: 74px;
    border-radius: 50%;
    border: 2px solid rgba(0,220,255,.5);
    background: rgba(0,40,80,.55);
    color: #0ff;
    font-size: 28px;
    backdrop-filter: blur(6px);
    touch-action: none;
  }
  #mobileCtrl button:active { background: rgba(0,120,200,.7); }
  #fireBtn {
    width: 88px !important; height: 88px !important;
    background: rgba(255,60,100,.4) !important;
    border-color: rgba(255,80,120,.7) !important;
    color: #ff6688 !important;
    font-size: 15px !important;
    font-weight: 800;
  }
  @media (hover: none) and (pointer: coarse) {
    #mobileCtrl { display: flex; }
  }
</style>
</head>
<body>

<!-- HUD -->
<div id="hud">
  <div class="hud-row">
    <div class="panel">
      <div class="stat">得分 SCORE</div>
      <b id="scoreEl">0</b>
      <div id="livesBar"></div>
    </div>
    <div class="panel" style="text-align:right">
      <div class="stat">波次 WAVE</div>
      <b id="waveEl">1</b>

  <div class="hud-row" style="align-items:flex-end">

      <div class="stat">武器 WEAPON</div>

</div>

<div id="damageFlash"></div>

</div>

<!-- 移动端控制 -->
<div id="mobileCtrl">
  <button id="leftBtn">◀</button>

  <button id="rightBtn">▶</button>
</div>

<!-- 菜单 -->
<div id="overlay">
  <h1 id="title">NEBULA STRIKE</h1>
  <p id="subtitle">星云突击 · 3D 太空射击</p>

  <div class="controls" id="ctrlBox">
    <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>A</kbd> <kbd>D</kbd> 移动飞船<br>
    <kbd>空格</kbd> 开火 &nbsp;|&nbsp; <kbd>P</kbd> 暂停<br>
    手机：左右按钮移动，红色按钮开火<br>
    收集 <span style="color:#0ff">蓝色道具</span> 升级武器，
    <span style="color:#ff0">黄色道具</span> 获得护盾
  </div>

  <div id="finalStats">
    <div><span>得分</span><b id="fsScore">0</b></div>
    <div><span>击杀</span><b id="fsKills">0</b></div>
    <div><span>波次</span><b id="fsWave">1</b></div>
  </div>

  <button id="startBtn">开始任务</button>
  <div id="hint">提示：连击不断可获得额外得分倍率</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* =========================================================
   NEBULA STRIKE — 3D 太空射击
   引擎：Three.js
   功能：射击 / 敌人 AI / 波次 / Boss / 道具 / 粒子 / 音效
   ========================================================= */

// ---------- 基础工具 ----------
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ---------- 音效引擎（Web Audio 程序化合成） ----------
const Sound = (() => {
  let ctx = null;
  let master = null;
  let enabled = true;

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.25;
      master.connect(ctx.destination);
    } catch (e) { enabled = false; }
  }

  function tone(freq, dur, type = 'sine', vol = 0.3, slideTo = null) {
    if (!enabled) return;
    init();
    if (!ctx) return;
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g); g.connect(master);
    osc.start(t); osc.stop(t + dur);
  }

  function noise(dur, vol = 0.3, filterFreq = 1000) {
    if (!enabled) return;
    init();
    if (!ctx) return;
    const t = ctx.currentTime;
    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = filterFreq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(filter); filter.connect(g); g.connect(master);
    src.start(t);
  }

  return {
    init,
    shoot() { tone(880, 0.08, 'square', 0.12, 220); },
    enemyShoot() { tone(300, 0.12, 'sawtooth', 0.08, 120); },
    hit() { noise(0.1, 0.25, 2000); tone(180, 0.1, 'square', 0.1, 60); },
    explode() { noise(0.35, 0.5, 800); tone(90, 0.4, 'sawtooth', 0.2, 30); },
    powerup() { tone(660, 0.1, 'sine', 0.2); setTimeout(() => tone(990, 0.15, 'sine', 0.2), 80); },
    playerHit() { noise(0.4, 0.6, 500); tone(140, 0.5, 'sawtooth', 0.3, 40); },
    waveStart() {
      [440, 550, 660, 880].forEach((f, i) => setTimeout(() => tone(f, 0.18, 'triangle', 0.18), i * 90));
    },
    bossWarn() {
      for (let i = 0; i < 3; i++) setTimeout(() => tone(120, 0.3, 'sawtooth', 0.25, 80), i * 350);
    },
    gameOver() {
      [440, 350, 280, 180].forEach((f, i) => setTimeout(() => tone(f, 0.35, 'triangle', 0.25), i * 180));
    },
    toggle() { enabled = !enabled; return enabled; }
  };
})();

// ---------- Three.js 场景 ----------
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000308, 0.0032);

const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 3000);
camera.position.set(0, 4.5, 14);
camera.lookAt(0, 0, -30);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = false;
document.body.appendChild(renderer.domElement);

// 灯光
scene.add(new THREE.AmbientLight(0x8899ff, 1.1));
const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
keyLight.position.set(8, 14, 10);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0xff4488, 1.2);
rimLight.position.set(-10, -5, -12);
scene.add(rimLight);
const fillLight = new THREE.PointLight(0x00ffff, 1.5, 120);
fillLight.position.set(0, 8, 5);
scene.add(fillLight);

// ---------- 星空（多层） ----------
function createStarLayer(count, spread, size, color, opacity) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count * 3; i++) pos[i] = (Math.random() - 0.5) * spread;
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color, size, transparent: true, opacity,
    sizeAttenuation: true, depthWrite: false
  });
  const pts = new THREE.Points(geo, mat);
  scene.add(pts);
  return pts;
}
const starLayers = [
  createStarLayer(2500, 2200, 1.6, 0xffffff, 0.85),
  createStarLayer(1800, 1800, 2.6, 0x88ccff, 0.6),
  createStarLayer(900, 1400, 4.0, 0xff88cc, 0.4)
];

// 星云背景（大球体贴图程序生成）
function createNebulaTexture() {
  const size = 512;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = '#000008';
  g.fillRect(0, 0, size, size);
  const colors = ['#0a1a3a', '#1a0a3a', '#0a2a3a', '#2a0a2a', '#001a2a'];
  for (let i = 0; i < 60; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    const r = rand(40, 160);
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    const col = colors[randInt(0, colors.length - 1)];
    grad.addColorStop(0, col + 'cc');
    grad.addColorStop(1, 'transparent');
    g.fillStyle = grad;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  // 星点
  for (let i = 0; i < 800; i++) {
    g.fillStyle = `rgba(255,255,255,${Math.random() * 0.8})`;
    g.fillRect(Math.random() * size, Math.random() * size, 1, 1);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  return tex;
}
const nebulaSphere = new THREE.Mesh(
  new THREE.SphereGeometry(1500, 32, 32),
  new THREE.MeshBasicMaterial({
    map: createNebulaTexture(),
    side: THREE.BackSide,
    depthWrite: false,
    transparent: true,
    opacity: 0.55
  })
);
scene.add(nebulaSphere);

// ---------- 飞船 ----------
function createShip() {
  const group = new THREE.Group();

  // 主体
  const bodyGeo = new THREE.ConeGeometry(0.62, 2.4, 10);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x00ddff, emissive: 0x0077ff, emissiveIntensity: 0.9,
    metalness: 0.85, roughness: 0.18
  });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.rotation.x = -Math.PI / 2;
  group.add(body);

  // 机翼
  const wingGeo = new THREE.BoxGeometry(2.6, 0.1, 0.9);
  const wingMat = new THREE.MeshStandardMaterial({
    color: 0x0066ff, emissive: 0x0033aa, emissiveIntensity: 0.7,
    metalness: 0.7, roughness: 0.3
  });
  const wing = new THREE.Mesh(wingGeo, wingMat);
  wing.position.set(0, -0.05, 0.5);
  group.add(wing);

  // 侧翼小翼
  for (const sign of [-1, 1]) {
    const finGeo = new THREE.BoxGeometry(0.12, 0.55, 0.7);
    const fin = new THREE.Mesh(finGeo, wingMat);
    fin.position.set(sign * 1.2, 0.2, 0.6);
    fin.rotation.z = sign * 0.3;
    group.add(fin);
  }

  // 驾驶舱
  const cockGeo = new THREE.SphereGeometry(0.32, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2);
  const cockMat = new THREE.MeshStandardMaterial({
    color: 0xffffff, emissive: 0x00ffff, emissiveIntensity: 1.2,
    transparent: true, opacity: 0.85, metalness: 0.9, roughness: 0.05
  });
  const cock = new THREE.Mesh(cockGeo, cockMat);
  cock.position.set(0, 0.28, -0.3);
  cock.rotation.x = -Math.PI / 2;
  group.add(cock);

  // 引擎尾焰（两层）
  const flame1 = new THREE.Mesh(
    new THREE.ConeGeometry(0.34, 1.4, 10),
    new THREE.MeshBasicMaterial({ color: 0xff8800, transparent: true, opacity: 0.9 })
  );
  flame1.rotation.x = Math.PI / 2;
  flame1.position.z = 1.4;
  group.add(flame1);

  const flame2 = new THREE.Mesh(
    new THREE.ConeGeometry(0.18, 2.0, 8),
    new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.7 })
  );
  flame2.rotation.x = Math.PI / 2;
  flame2.position.z = 1.7;
  group.add(flame2);

  group.userData.flames = [flame1, flame2];
  return group;
}
const ship = createShip();
ship.position.set(0, 3, 0);
scene.add(ship);

// 护盾球
const shieldMesh = new THREE.Mesh(
  new THREE.SphereGeometry(2.0, 24, 18),
  new THREE.MeshBasicMaterial({
    color: 0xffdd00, wireframe: true,
    transparent: true, opacity: 0, depthWrite: false
  })
);
ship.add(shieldMesh);

// ---------- 对象池 ----------
const bullets = [];       // 玩家子弹
const enemyBullets = [];  // 敌人子弹
const enemies = [];       // 敌人
const particles = [];     // 粒子
const powerups = [];      // 道具

const bulletGeo = new THREE.SphereGeometry(0.18, 8, 6);
const bulletMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
const enemyBulletGeo = new THREE.SphereGeometry(0.22, 8, 6);
const enemyBulletMat = new THREE.MeshBasicMaterial({ color: 0xff3366 });

// ---------- 粒子系统 ----------
function spawnParticles(pos, count, color, speed = 12, size = 0.25, life = 0.8) {
  for (let i = 0; i < count; i++) {
    const geo = new THREE.SphereGeometry(size * rand(0.6, 1.4), 5, 4);
    const mat = new THREE.MeshBasicMaterial({
      color, transparent: true, opacity: 1
    });
    const p = new THREE.Mesh(geo, mat);
    p.position.copy(pos);
    p.userData = {
      vel: new THREE.Vector3(
        rand(-1, 1) * speed,
        rand(-1, 1) * speed,
        rand(-1, 1) * speed
      ),
      life: life * rand(0.6, 1.3),
      maxLife: life,
      spin: new THREE.Vector3(rand(-8, 8), rand(-8, 8), rand(-8, 8))
    };
    scene.add(p);
    particles.push(p);
  }
}

// ---------- 敌人类型 ----------
const ENEMY_TYPES = {
  scout: {
    hp: 2, speed: 14, size: 1.0, color: 0xff4466, emissive: 0x881122,
    score: 100, fireRate: 0, pattern: 'zigzag'
  },

  },

  },

function createEnemy(type) {
  const cfg = ENEMY_TYPES[type];
  const group = new THREE.Group();

  // 主体（多面体）
  const geo = new THREE.IcosahedronGeometry(cfg.size, 0);
  const mat = new THREE.MeshStandardMaterial({
    color: cfg.color, emissive: cfg.emissive,
    emissiveIntensity: 0.9, metalness: 0.6, roughness: 0.4,
    flatShading: true
  });
  const body = new THREE.Mesh(geo, mat);
  group.add(body);

  // 外壳环
  const ringGeo = new THREE.TorusGeometry(cfg.size * 1.3, 0.08, 6, 20);
  const ringMat = new THREE.MeshBasicMaterial({
    color: cfg.color, transparent: true, opacity: 0.75
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  group.add(ring);

  // 核心发光
  const coreGeo = new THREE.SphereGeometry(cfg.size * 0.4, 12, 10);
  const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const core = new THREE.Mesh(coreGeo, coreMat);
  group.add(core);

  group.position.set(
    rand(-16, 16),
    rand(-4, 8),
    -140 - Math.random() * 60
  );

  group.userData = {
    type,
    hp: cfg.hp,
    maxHp: cfg.hp,
    speed: cfg.speed,
    size: cfg.size,
    color: cfg.color,
    score: cfg.score,
    fireRate: cfg.fireRate,
    fireTimer: rand(0.5, 2),
    pattern: cfg.pattern,
    phase: Math.random() * Math.PI * 2,
    baseX: group.position.x,
    baseY: group.position.y,
    hitFlash: 0,
    body, ring, core
  };

  scene.add(group);
  enemies.push(group);
  return group;
}

// ---------- Boss ----------
function createBoss() {
  const group = new THREE.Group();
  const size = 4.5;

  // 主体
  const mainGeo = new THREE.IcosahedronGeometry(size, 1);
  const mainMat = new THREE.MeshStandardMaterial({
    color: 0xff2244, emissive: 0x880011,
    emissiveIntensity: 1.0, metalness: 0.8, roughness: 0.3,
    flatShading: true
  });
  const main = new THREE.Mesh(mainGeo, mainMat);
  group.add(main);

  // 外环
  const ringGeo = new THREE.TorusGeometry(size * 1.4, 0.3, 8, 40);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0xff6600 });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  group.add(ring);

  const ring2 = new THREE.Mesh(
    new THREE.TorusGeometry(size * 1.7, 0.15, 6, 36),
    new THREE.MeshBasicMaterial({ color: 0xffaa00 })
  );
  ring2.rotation.x = Math.PI / 3;
  group.add(ring2);

  // 炮塔
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2;
    const turret = new THREE.Mesh(
      new THREE.ConeGeometry(0.4, 1.5, 6),
      new THREE.MeshStandardMaterial({
        color: 0x441122, emissive: 0xff2244, emissiveIntensity: 0.6
      })
    );
    turret.position.set(Math.cos(a) * size * 1.2, Math.sin(a) * size * 1.2, 0);
    turret.lookAt(0, 0, 10);
    group.add(turret);
  }

  // 核心
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(1.3, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  group.add(core);

  group.position.set(0, 3, -80);
  group.userData = {
    isBoss: true,
    hp: 120,
    maxHp: 120,
    size: size * 1.3,
    score: 5000,
    fireTimer: 2,
    phase: 0,
    hitFlash: 0,
    main, ring, ring2, core,
    color: 0xff2244,
    speed: 4
  };

  scene.add(group);
  game.boss = group;
  return group;
}

// ---------- 射击 ----------
function firePlayerBullet() {
  const level = player.weaponLevel;

  const spawn = (offsetX, offsetY, angleZ = 0) => {
    const b = new THREE.Mesh(bulletGeo, bulletMat.clone());
    b.position.set(ship.position.x + offsetX, ship.position.y + offsetY, ship.position.z - 1.2);
    b.userData = {
      vel: new THREE.Vector3(Math.sin(angleZ) * 30, 0, -85),
      life: 2.5,
      damage: 1
    };
    scene.add(b);
    bullets.push(b);
  };

  if (level === 1) {
    spawn(0, 0);
  } else if (level === 2) {
    spawn(-0.45, 0);
    spawn(0.45, 0);
  } else if (level === 3) {
    spawn(-0.5, 0);
    spawn(0, 0);
    spawn(0.5, 0);
  } else if (level === 4) {
    spawn(-0.6, 0, -0.08);
    spawn(-0.2, 0);
    spawn(0.2, 0);
    spawn(0.6, 0, 0.08);
  } else {
    spawn(-0.7, 0, -0.15);
    spawn(-0.35, 0, -0.06);
    spawn(0, 0);
    spawn(0.35, 0, 0.06);
    spawn(0.7, 0, 0.15);
  }

  Sound.shoot();
  player.fireCooldown = Math.max(0.06, 0.16 - level * 0.02);
}

function fireEnemyBullet(enemy, aimAtPlayer = true) {
  const size = enemy.userData.size || 1;
  const geo = enemyBulletGeo;
  const b = new THREE.Mesh(geo, enemyBulletMat.clone());
  b.position.copy(enemy.position);

  let vel;
  if (aimAtPlayer) {
    const dir = new THREE.Vector3(
      ship.position.x - enemy.position.x,
      ship.position.y - enemy.position.y,
      ship.position.z - enemy.position.z
    ).normalize().multiplyScalar(35);
    vel = dir;
  } else {
    vel = new THREE.Vector3(0, 0, 35);
  }

  b.userData = { vel, life: 4, damage: 1 };
  scene.add(b);
  enemyBullets.push(b);
  Sound.enemyShoot();
}

function fireBossBullet(boss, count = 8, spread = Math.PI * 2) {
  for (let i = 0; i < count; i++) {
    const a = (i / count) * spread + boss.userData.phase;
    const b = new THREE.Mesh(enemyBulletGeo, new THREE.MeshBasicMaterial({ color: 0xff8800 }));
    b.position.copy(boss.position);
    b.userData = {
      vel: new THREE.Vector3(Math.cos(a) * 22, Math.sin(a) * 22, 22),
      life: 5, damage: 1, big: true
    };
    b.scale.setScalar(1.8);
    scene.add(b);
    enemyBullets.push(b);
  }
  Sound.enemyShoot();
}

// ---------- 波次系统 ----------
function startWave(n) {
  game.wave = n;
  game.difficulty = 1 + (n - 1) * 0.18;
  $('waveEl').textContent = n;

  if (n % 5 === 0) {
    // Boss 波
    showWaveMessage('⚠ BOSS 来袭 ⚠', '#ff3366');
    Sound.bossWarn();
    setTimeout(() => createBoss(), 1400);
    $('bossBar').classList.add('show');
    $('bossFill').style.width = '100%';
  } else {
    showWaveMessage('WAVE ' + n, '#0ff');
    Sound.waveStart();
    game.enemiesToSpawn = 4 + n * 2;
    game.enemiesSpawned = 0;
    game.spawnTimer = 0.5;
  }
}

function showWaveMessage(text, color) {
  const el = $('waveMsg');
  el.textContent = text;
  el.style.color = color;
  el.style.textShadow = `0 0 30px ${color}, 0 0 60px ${color}`;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1600);
}

function chooseEnemyType() {
  const w = game.wave;
  const pool = ['scout'];
  if (w >= 2) pool.push('fighter');
  if (w >= 3) pool.push('sniper');
  if (w >= 4) pool.push('tank');
  if (w >= 6) pool.push('fighter', 'tank', 'sniper');
  return pool[randInt(0, pool.length - 1)];
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;

  if (k === 'p' && game.state === 'playing') pauseGame();

// ---------- 游戏流程 ----------
function startGame() {
  Sound.init();

  // 重置
  player.x = 0; player.targetX = 0;
  player.lives = 3;
  player.score = 0;
  player.kills = 0;
  player.combo = 0; player.comboTimer = 0;
  player.weaponLevel = 1;
  player.fireCooldown = 0;
  player.shield = 0;
  player.invuln = 1.5;
  player.alive = true;

  game.state = 'playing';
  game.wave = 1;
  game.frame = 0;
  game.screenShake = 0;
  game.boss = null;

  // 清理
  [...bullets, ...enemyBullets, ...enemies, ...particles, ...powerups, ...rings].forEach(o => scene.remove(o));
  bullets.length = enemyBullets.length = enemies.length = 0;
  particles.length = powerups.length = rings.length = 0;

  ship.position.set(0, 3, 0);
  ship.visible = true;
  shieldMesh.material.opacity = 0;
  $('bossBar').classList.remove('show');

  buildLivesBar();
  updateHUD();

  $('overlay').classList.add('hide');
  $('finalStats').classList.remove('show');

  startWave(1);
}

function pauseGame() {
  game.state = 'paused';
  $('overlay').classList.remove('hide');
  $('title').textContent = '已暂停';
  $('subtitle').textContent = '按 P 继续';
  $('ctrlBox').style.display = 'none';
  $('startBtn').textContent = '继续';
  $('startBtn').onclick = resumeGame;
}

function resumeGame() {
  game.state = 'playing';
  $('overlay').classList.add('hide');
  $('title').textContent = 'NEBULA STRIKE';
  $('startBtn').onclick = startGame;
}

function gameOver() {
  game.state = 'over';
  player.alive = false;
  Sound.gameOver();
  spawnParticles(ship.position, 60, 0x00ffff, 20, 0.35, 1.4);
  spawnRing(ship.position, 0x00ffff, 12);
  ship.visible = false;

  setTimeout(() => {
    $('overlay').classList.remove('hide');
    $('title').textContent = '任务失败';
    $('subtitle').textContent = '飞船已被摧毁';
    $('ctrlBox').style.display = 'none';
    $('finalStats').classList.add('show');
    $('fsScore').textContent = Math.floor(player.score).toLocaleString();
    $('fsKills').textContent = player.kills;
    $('fsWave').textContent = game.wave;
    $('startBtn').textContent = '再来一次';
    $('startBtn').onclick = startGame;
    $('hint').textContent = '最佳成绩会保存在本地';
    saveBest();
  }, 800);
}

function saveBest() {
  try {
    const best = parseInt(localStorage.getItem('nebula_best') || '0');
    if (player.score > best) {
      localStorage.setItem('nebula_best', Math.floor(player.score));
      $('hint').textContent = '🎉 新纪录！';
    } else {
      $('hint').textContent = '历史最佳：' + best.toLocaleString();
    }
  } catch (e) {}
}

function damagePlayer(amount = 1) {
  if (player.invuln > 0) return;
  if (player.shield > 0) {
    player.shield = Math.max(0, player.shield - 1);
    shieldMesh.material.opacity = 0;
    Sound.hit();
    player.invuln = 0.8;
    flashDamage();
    game.screenShake = 0.5;
    updateHUD();
    return;
  }
  player.lives -= amount;
  player.invuln = 1.8;
  player.combo = 0;
  Sound.playerHit();
  flashDamage();
  game.screenShake = 1.2;
  spawnParticles(ship.position, 25, 0xff4466, 14, 0.25, 0.8);
  updateHUD();
  if (player.lives <= 0) gameOver();
}

function addScore(base) {
  const mult = 1 + Math.floor(player.combo / 5) * 0.5;
  player.score += base * mult;
}

function onEnemyKilled(enemy) {
  const ud = enemy.userData;
  player.kills++;
  player.combo++;
  player.comboTimer = 3;

  if (player.combo > 0 && player.combo % 5 === 0) showCombo(player.combo);

  addScore(ud.score);
  Sound.explode();
  spawnParticles(enemy.position, 22, ud.color, 14, 0.28, 0.9);
  spawnRing(enemy.position, ud.color, 5);
  game.screenShake = Math.min(0.8, game.screenShake + 0.3);

  // 掉落
  const dropChance = ud.type === 'tank' ? 0.6 : 0.18;
  if (Math.random() < dropChance) {
    spawnPowerup(enemy.position);
  }

  scene.remove(enemy);
  const i = enemies.indexOf(enemy);
  if (i >= 0) enemies.splice(i, 1);
  updateHUD();
}

// ---------- 主循环 ----------
let lastTime = performance.now();

function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  game.frame++;

  // 星空永远流动
  updateStars(dt);

  if (game.state === 'playing') {
    updatePlayer(dt);
    updateBullets(dt);
    updateEnemies(dt);
    updateEnemyBullets(dt);
    updatePowerups(dt);
    updateSpawning(dt);
    updateBossLogic(dt);
    updateCombo(dt);
    updateWaveProgress();
  }

  updateParticles(dt);
  updateRings(dt);
  updateCamera(dt);
  updateShipVisual(dt);

  renderer.render(scene, camera);
}

function updateStars(dt) {
  const speed = game.state === 'playing' ? 120 * game.difficulty : 30;
  starLayers.forEach((layer, idx) => {
    const pos = layer.geometry.attributes.position.array;
    const step = speed * (1 + idx * 0.4) * dt;
    for (let i = 2; i < pos.length; i += 3) {
      pos[i] += step;
      if (pos[i] > 1100) pos[i] = -1100;
    }
    layer.geometry.attributes.position.needsUpdate = true;
  });
  nebulaSphere.rotation.z += dt * 0.005;
}

function updatePlayer(dt) {
  if (!player.alive) return;

  // 移动
  if (keys['arrowleft'] || keys['a'] || mobileLeft) player.targetX -= 42 * dt;
  if (keys['arrowright'] || keys['d'] || mobileRight) player.targetX += 42 * dt;
  player.targetX = clamp(player.targetX, -16, 16);
  player.x = lerp(player.x, player.targetX, 0.18);
  ship.position.x = player.x;

  // 浮动
  ship.position.y = 3 + Math.sin(game.frame * 0.05) * 0.18;

  // 倾斜
  const tilt = (player.targetX - player.x) * -0.08;
  ship.rotation.z = lerp(ship.rotation.z, tilt, 0.2);
  ship.rotation.x = Math.sin(game.frame * 0.08) * 0.04;

  // 无敌闪烁
  if (player.invuln > 0) {
    player.invuln -= dt;
    ship.visible = Math.floor(game.frame / 4) % 2 === 0;
    if (player.invuln <= 0) ship.visible = true;
  }

  // 护盾显示
  if (player.shield > 0) {
    shieldMesh.material.opacity = 0.35 + Math.sin(game.frame * 0.15) * 0.15;
    shieldMesh.rotation.y += dt * 2;
    shieldMesh.rotation.x += dt * 1.2;
  } else {
    shieldMesh.material.opacity = 0;
  }

  // 开火
  player.fireCooldown -= dt;
  const firing = keys[' '] || keys['w'] || keys['arrowup'] || mobileFire;
  if (firing && player.fireCooldown <= 0) {
    firePlayerBullet();
  }
}

function updateShipVisual(dt) {
  const flames = ship.userData.flames;
  flames.forEach((f, i) => {
    f.scale.y = 0.7 + Math.random() * 0.7 + (i === 1 ? 0.4 : 0);
    f.material.opacity = 0.6 + Math.random() * 0.4;
  });
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.position.addScaledVector(b.userData.vel, dt);
    b.userData.life -= dt;

    let hit = false;

    // 碰撞敌人
    for (let j = enemies.length - 1; j >= 0; j--) {
      const e = enemies[j];
      const d = b.position.distanceTo(e.position);
      if (d < e.userData.size * 1.1) {
        e.userData.hp -= b.userData.damage;
        e.userData.hitFlash = 0.15;
        spawnParticles(b.position, 5, 0x00ffff, 8, 0.15, 0.4);
        Sound.hit();
        hit = true;
        if (e.userData.hp <= 0) onEnemyKilled(e);
        break;
      }
    }

    // 碰撞 Boss
    if (!hit && game.boss) {
      const d = b.position.distanceTo(game.boss.position);
      if (d < game.boss.userData.size) {
        game.boss.userData.hp -= b.userData.damage;
        game.boss.userData.hitFlash = 0.12;
        spawnParticles(b.position, 5, 0x00ffff, 8, 0.15, 0.4);
        Sound.hit();
        hit = true;
        $('bossFill').style.width = Math.max(0, game.boss.userData.hp / game.boss.userData.maxHp * 100) + '%';
        if (game.boss.userData.hp <= 0) killBoss();
      }
    }

    if (hit || b.userData.life <= 0 || b.position.z < -200) {
      scene.remove(b);
      bullets.splice(i, 1);
    }
  }
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const ud = e.userData;

    // 移动模式
    if (ud.pattern === 'zigzag') {
      e.position.z += ud.speed * dt;
      e.position.x = ud.baseX + Math.sin(game.frame * 0.05 + ud.phase) * 6;
    } else if (ud.pattern === 'straight') {
      e.position.z += ud.speed * dt;
    } else if (ud.pattern === 'slow') {
      e.position.z += ud.speed * dt * 0.7;
      e.position.y = ud.baseY + Math.sin(game.frame * 0.03 + ud.phase) * 2;
    } else if (ud.pattern === 'dive') {
      e.position.z += ud.speed * dt;
      e.position.y = lerp(e.position.y, ship.position.y, 0.008);
    }

    // 旋转
    e.rotation.x += dt * 0.8;
    e.rotation.y += dt * 1.2;
    e.userData.ring.rotation.z += dt * 2;

    // 击中闪白
    if (ud.hitFlash > 0) {
      ud.hitFlash -= dt;
      ud.body.material.emissiveIntensity = 3;
    } else {
      ud.body.material.emissiveIntensity = 0.9;
    }

    // 开火
    if (ud.fireRate > 0) {
      ud.fireTimer -= dt;
      if (ud.fireTimer <= 0 && e.position.z > -80 && e.position.z < 5) {
        fireEnemyBullet(e, true);
        ud.fireTimer = ud.fireRate / game.difficulty;
      }
    }

    // 撞到玩家
    if (player.alive && player.invuln <= 0) {
      const d = e.position.distanceTo(ship.position);
      if (d < ud.size + 1.0) {
        damagePlayer(1);
        spawnParticles(e.position, 20, ud.color, 14, 0.3, 0.8);
        scene.remove(e);
        enemies.splice(i, 1);
        continue;
      }
    }

    // 飞出
    if (e.position.z > 20) {
      scene.remove(e);
      enemies.splice(i, 1);
    }
  }
}

function updateEnemyBullets(dt) {
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.position.addScaledVector(b.userData.vel, dt);
    b.userData.life -= dt;

    // 撞玩家
    if (player.alive && player.invuln <= 0) {
      const d = b.position.distanceTo(ship.position);
      if (d < (b.userData.big ? 1.6 : 1.0)) {
        damagePlayer(1);
        scene.remove(b);
        enemyBullets.splice(i, 1);
        continue;
      }
    }

    if (b.userData.life <= 0 || b.position.z > 25 || Math.abs(b.position.x) > 60 || Math.abs(b.position.y) > 40) {
      scene.remove(b);
      enemyBullets.splice(i, 1);
    }
  }
}

function updatePowerups(dt) {
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.position.z += 18 * dt;
    p.rotation.y += dt * 2;
    p.rotation.x += dt * 1.4;
    p.userData.ring.rotation.z += dt * 3;
    p.userData.life -= dt;

    // 吸取
    const d = p.position.distanceTo(ship.position);
    if (d < 6) {
      const dir = new THREE.Vector3().subVectors(ship.position, p.position).normalize();
      p.position.addScaledVector(dir, 25 * dt);
    }

    if (d < 1.5 && player.alive) {
      // 拾取
      Sound.powerup();
      if (p.userData.type === 'weapon') {
        player.weaponLevel = Math.min(player.maxWeaponLevel, player.weaponLevel + 1);
        showWaveMessage('武器升级 Lv.' + player.weaponLevel, '#0ff');
      } else if (p.userData.type === 'shield') {
        player.shield = Math.min(3, player.shield + 1);
        showWaveMessage('护盾 +1', '#ffdd00');
      } else if (p.userData.type === 'life') {
        player.lives = Math.min(player.maxLives, player.lives + 1);
        buildLivesBar();
        showWaveMessage('生命 +1', '#ff3366');
      }
      updateHUD();
      scene.remove(p);
      powerups.splice(i, 1);
      continue;
    }

    if (p.userData.life <= 0 || p.position.z > 20) {
      scene.remove(p);
      powerups.splice(i, 1);
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const ud = p.userData;
    p.position.addScaledVector(ud.vel, dt);
    ud.vel.multiplyScalar(0.96);
    ud.life -= dt;
    p.material.opacity = Math.max(0, ud.life / ud.maxLife);
    p.scale.multiplyScalar(1 - dt * 0.6);
    p.rotation.x += ud.spin.x * dt;
    p.rotation.y += ud.spin.y * dt;
    if (ud.life <= 0) {
      scene.remove(p);
      particles.splice(i, 1);
    }
  }
}

function updateRings(dt) {
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.userData.life -= dt;
    const t = 1 - r.userData.life / r.userData.maxLife;
    const s = 1 + t * r.userData.maxR;
    r.scale.setScalar(s);
    r.material.opacity = 1 - t;
    if (r.userData.life <= 0) {
      scene.remove(r);
      rings.splice(i, 1);
    }
  }
}

function updateSpawning(dt) {
  if (game.boss) return;
  if (game.enemiesSpawned >= game.enemiesToSpawn) return;

  game.spawnTimer -= dt;
  if (game.spawnTimer <= 0) {
    const type = chooseEnemyType();
    createEnemy(type);
    game.enemiesSpawned++;
    game.spawnTimer = Math.max(0.35, 1.2 - game.difficulty * 0.08);
  }
}

function updateWaveProgress() {
  if (game.boss) return;
  if (game.enemiesSpawned >= game.enemiesToSpawn && enemies.length === 0) {
    // 波次完成
    if (!game._waveTransition) {
      game._waveTransition = true;
      player.score += 200 * game.wave;
      showWaveMessage('波次完成 +' + (200 * game.wave), '#0ff');
      setTimeout(() => {
        game._waveTransition = false;
        startWave(game.wave + 1);
      }, 1800);
    }
  }
}

function updateBossLogic(dt) {
  if (!game.boss) return;
  const b = game.boss;
  const ud = b.userData;

  ud.phase += dt;

  // 移动
  b.position.z = lerp(b.position.z, -55, 0.02);
  b.position.x = Math.sin(ud.phase * 0.7) * 12;
  b.position.y = 3 + Math.sin(ud.phase * 0.5) * 3;

  // 旋转
  b.rotation.y += dt * 0.6;
  b.rotation.x += dt * 0.3;
  ud.ring.rotation.z += dt * 1.5;
  ud.ring2.rotation.z -= dt * 2;
  ud.core.scale.setScalar(1 + Math.sin(ud.phase * 5) * 0.15);

  // 闪白
  if (ud.hitFlash > 0) {
    ud.hitFlash -= dt;
    ud.main.material.emissiveIntensity = 3;
  } else {
    ud.main.material.emissiveIntensity = 1.0;
  }

  // 攻击
  ud.fireTimer -= dt;
  if (ud.fireTimer <= 0) {
    const hpRatio = ud.hp / ud.maxHp;
    if (hpRatio > 0.6) {
      fireBossBullet(b, 8, Math.PI * 2);
      ud.fireTimer = 1.8;
    } else if (hpRatio > 0.3) {
      fireBossBullet(b, 12, Math.PI * 2);
      setTimeout(() => fireEnemyBullet(b, true), 200);
      setTimeout(() => fireEnemyBullet(b, true), 400);
      ud.fireTimer = 1.4;
    } else {
      fireBossBullet(b, 16, Math.PI * 2);
      for (let i = 0; i < 3; i++) setTimeout(() => fireEnemyBullet(b, true), i * 150);
      ud.fireTimer = 1.0;
    }
  }

  // 撞玩家
  if (player.alive && player.invuln <= 0) {
    const d = b.position.distanceTo(ship.position);
    if (d < ud.size + 1) damagePlayer(1);
  }
}

function killBoss() {
  const b = game.boss;
  if (!b) return;

  Sound.explode();
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      const p = b.position.clone().add(new THREE.Vector3(rand(-4, 4), rand(-4, 4), rand(-4, 4)));
      spawnParticles(p, 30, [0xff2244, 0xff8800, 0xffdd00][i % 3], 20, 0.4, 1.2);
      spawnRing(p, 0xff6600, 10);
      Sound.explode();
    }, i * 180);
  }

  player.score += b.userData.score;
  showWaveMessage('BOSS 击破 +' + b.userData.score, '#ffdd00');
  game.screenShake = 2;

  scene.remove(b);
  game.boss = null;
  $('bossBar').classList.remove('show');
  updateHUD();

  // 掉落一堆道具
  for (let i = 0; i < 4; i++) {
    setTimeout(() => {
      const pos = new THREE.Vector3(rand(-8, 8), rand(1, 5), -30 - i * 5);
      spawnPowerup(pos, ['weapon', 'shield', 'life'][i % 3]);
    }, 400 + i * 200);
  }
}

function updateCombo(dt) {
  if (player.comboTimer > 0) {
    player.comboTimer -= dt;
    if (player.comboTimer <= 0) player.combo = 0;
  }
}

function updateCamera(dt) {
  // 屏幕震动
  if (game.screenShake > 0) {
    game.screenShake = Math.max(0, game.screenShake - dt * 3);
    const s = game.screenShake * 0.6;
    camera.position.x = lerp(camera.position.x, ship.position.x * 0.3 + rand(-s, s), 0.15);
    camera.position.y = lerp(camera.position.y, 4.5 + rand(-s, s), 0.15);
    camera.position.z = lerp(camera.position.z, 14 + rand(-s, s) * 0.5, 0.15);
  } else {
    camera.position.x = lerp(camera.position.x, ship.position.x * 0.3, 0.08);
    camera.position.y = lerp(camera.position.y, 4.5, 0.08);
    camera.position.z = lerp(camera.position.z, 14, 0.08);
  }

  camera.lookAt(ship.position.x * 0.5, 1.5, -30);
  camera.rotation.z = (ship.position.x - camera.position.x) * 0.008;
}

// ---------- 启动 ----------
buildLivesBar();
$('startBtn').onclick = startGame;
requestAnimationFrame(animate);

// 窗口自适应
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// 阻止右键菜单
addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
